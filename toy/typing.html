<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>타자 속도 측정👀</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&display=swap');
        
        body { font-family: 'Pretendard', sans-serif; }
        .code-font { font-family: 'JetBrains Mono', monospace; }
        .correct { color: #06b6d4; font-weight: 700; }
        .incorrect { color: #ef4444; background-color: #fee2e2; border-radius: 2px; }
        .current { border-bottom: 2px solid #06b6d4; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col items-center justify-center p-4">

    <div class="max-w-2xl w-full bg-white rounded-3xl shadow-sm border border-slate-200/80 p-6 md:p-10 space-y-8">
        
        <!-- 상단 헤더 -->
        <div class="flex items-center justify-between border-b border-slate-100 pb-4">
            <div>
                <h1 class="text-xl font-bold text-slate-900 flex items-center gap-2">
                    <i class="fa-solid fa-keyboard text-cyan-500"></i> Dev 타자 측정기
                </h1>
                <p class="text-xs text-slate-400 mt-1">개발자 필수 생존 명령어 스피드 테스트</p>
            </div>
            <a href="../index.html" class="text-xs font-medium text-cyan-600 hover:text-cyan-700 bg-cyan-50 px-3 py-2 rounded-xl transition">
                <i class="fa-solid fa-house mr-1"></i> 메인으로
            </a>
        </div>

        <!-- 실시간 스탯 대시보드 -->
        <div class="grid grid-cols-3 gap-4">
            <div class="bg-slate-50 p-4 rounded-2xl text-center border border-slate-100">
                <p class="text-xs text-slate-400 font-medium">타수 (CPM)</p>
                <p id="cpm-display" class="text-2xl font-bold text-cyan-500 mt-1 code-font">0</p>
            </div>
            <div class="bg-slate-50 p-4 rounded-2xl text-center border border-slate-100">
                <p class="text-xs text-slate-400 font-medium">정확도 (%)</p>
                <p id="acc-display" class="text-2xl font-bold text-blue-500 mt-1 code-font">100%</p>
            </div>
            <div class="bg-slate-50 p-4 rounded-2xl text-center border border-slate-100">
                <p class="text-xs text-slate-400 font-medium">최고 기록</p>
                <p id="best-display" class="text-2xl font-bold text-slate-700 mt-1 code-font">0</p>
            </div>
        </div>

        <!-- 문제 표시 영역 (터미널 스타일) -->
        <div class="bg-slate-900 text-slate-300 p-6 rounded-2xl shadow-inner relative">
            <div class="flex items-center gap-1.5 mb-4">
                <span class="w-3 h-3 rounded-full bg-red-400"></span>
                <span class="w-3 h-3 rounded-full bg-amber-400"></span>
                <span class="w-3 h-3 rounded-full bg-emerald-400"></span>
                <span class="text-[11px] text-slate-500 ml-2 code-font">bash — 80x24</span>
            </div>
            <div id="quote-display" class="code-font text-lg md:text-xl leading-relaxed tracking-wide select-none break-all">
                <!-- 여기에 문제가 글자 단위로 렌더링됩니다 -->
            </div>
        </div>

        <!-- 사용자 입력창 -->
        <div class="space-y-3">
            <input type="text" id="typing-input" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
                   placeholder="위 명령어를 그대로 입력하세요 (입력 시작 시 타이머 작동)"
                   class="w-full px-5 py-4 bg-slate-50 border-2 border-slate-200 rounded-2xl code-font text-base focus:outline-none focus:border-cyan-400 focus:bg-white transition">
            
            <div class="flex justify-between items-center text-xs text-slate-400 px-1">
                <span>💡 오타 없이 끝까지 치면 자동으로 다음 문제로 넘어갑니다</span>
                <button onclick="resetGame()" class="text-cyan-600 hover:underline font-medium">
                    <i class="fa-solid fa-rotate-right mr-1"></i> 다른 문제
                </button>
            </div>
        </div>

    </div>

    <script>
        // 재미있는 명령어나 코드 문장을 계속 추가하기!
        const CODE_SNIPPETS = [
            "git push origin main --force",
            "sudo rm -rf / --no-preserve-root",
            "docker-compose up -d --build",
            "SELECT * FROM users WHERE coffee_level = 0;",
            "chmod 777 ./deploy.sh && ./deploy.sh",
            "git reset --hard HEAD~1",
            "ps aux | grep python | awk '{print $2}' | xargs kill -9",
            "console.log('Why does this work?');",
            "kubectl get pods --all-namespaces",
            "ssh -i ~/.ssh/id_rsa root@127.0.0.1"
        ];

        const quoteDisplay = document.getElementById('quote-display');
        const typingInput = document.getElementById('typing-input');
        const cpmDisplay = document.getElementById('cpm-display');
        const accDisplay = document.getElementById('acc-display');
        const bestDisplay = document.getElementById('best-display');

        let currentQuote = "";
        let startTime = null;
        let totalTyped = 0;
        let errorCount = 0;
        let bestCpm = localStorage.getItem('dev_typing_best') || 0;

        bestDisplay.innerText = bestCpm;

        function loadNewQuote() {
            const randomIndex = Math.floor(Math.random() * CODE_SNIPPETS.length);
            currentQuote = CODE_SNIPPETS[randomIndex];
            quoteDisplay.innerHTML = '';
            
            currentQuote.split('').forEach((char, idx) => {
                const span = document.createElement('span');
                span.innerText = char;
                if (idx === 0) span.classList.add('current');
                quoteDisplay.appendChild(span);
            });

            typingInput.value = '';
            startTime = null;
            totalTyped = 0;
            errorCount = 0;
        }

        typingInput.addEventListener('input', () => {
            if (!startTime) startTime = Date.now();

            const arrayQuote = quoteDisplay.querySelectorAll('span');
            const arrayValue = typingInput.value.split('');
            
            totalTyped++;
            let currentErrors = 0;
            let allCorrect = true;

            arrayQuote.forEach((charSpan, index) => {
                const character = arrayValue[index];
                charSpan.classList.remove('current');

                if (character == null) {
                    charSpan.classList.remove('correct', 'incorrect');
                    allCorrect = false;
                } else if (character === charSpan.innerText) {
                    charSpan.classList.add('correct');
                    charSpan.classList.remove('incorrect');
                } else {
                    charSpan.classList.add('incorrect');
                    charSpan.classList.remove('correct');
                    allCorrect = false;
                    currentErrors++;
                }
            });

            // 현재 커서 위치 표시
            if (arrayValue.length < arrayQuote.length) {
                arrayQuote[arrayValue.length].classList.add('current');
            }

            // 실시간 타수(CPM) 및 정확도 계산
            const elapsedMinutes = (Date.now() - startTime) / 60000;
            const cpm = elapsedMinutes > 0 ? Math.round(arrayValue.length / elapsedMinutes) : 0;
            const accuracy = arrayValue.length > 0 
                ? Math.max(0, Math.round(((arrayValue.length - currentErrors) / arrayValue.length) * 100)) 
                : 100;

            cpmDisplay.innerText = cpm;
            accDisplay.innerText = accuracy + '%';

            // 문장 완벽 입력 완료 시 처리
            if (allCorrect && arrayValue.length === arrayQuote.length) {
                if (cpm > bestCpm) {
                    bestCpm = cpm;
                    localStorage.setItem('dev_typing_best', bestCpm);
                    bestDisplay.innerText = bestCpm;
                }
                setTimeout(loadNewQuote, 300); // 0.3초 후 다음 문제 자동 출제
            }
        });

        function resetGame() {
            loadNewQuote();
            typingInput.focus();
        }

        // 초기 실행
        loadNewQuote();
    </script>
</body>
</html>
